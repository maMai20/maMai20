<svg width="980" height="500" viewBox="0 0 980 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated cat coding in a starry computer screen</title>
  <desc id="desc">A quiet star-themed computer screen with a small animated pixel cat, useful for a frontend developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02050B"/>
      <stop offset=".55" stop-color="#071526"/>
      <stop offset="1" stop-color="#02050B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#071C32"/>
      <stop offset="1" stop-color="#02070F"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="980" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#67E8F9"/>
      <stop offset=".85" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#E2F6D8" fill-opacity=".96"/>
      <rect y="4" width="8" height="4" fill="#83CFA0" fill-opacity=".78"/>
    </pattern>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="980" height="500" rx="26" fill="url(#bg)"/>

  <g fill="#E0F2FE">
    <circle cx="75" cy="70" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="176" cy="126" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="68" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="136" r="1.2"><animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="390" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="867" cy="398" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="monospace">
    <text x="64" y="61" fill="#67E8F9" font-size="14" letter-spacing="3">FRONTEND / IN PROGRESS</text>
    <text x="64" y="89" fill="#64748B" font-size="12">build • learn • improve</text>
    <text x="916" y="62" fill="#64748B" font-size="12" text-anchor="end">stars: on ✦</text>
  </g>

  <g>
    <rect x="208" y="110" width="564" height="294" rx="18" fill="#101A26" stroke="#334155" stroke-width="2"/>
    <rect x="225" y="127" width="530" height="248" rx="9" fill="url(#screen)" stroke="#0EA5E9" stroke-opacity=".55"/>
    <path d="M225 181C350 150 442 200 550 173C644 150 696 188 755 168" stroke="url(#wave)" stroke-width="4" filter="url(#glow)" opacity=".9"/>
    <path d="M225 187C350 156 442 206 550 179C644 156 696 194 755 174" stroke="#22D3EE" stroke-opacity=".3" stroke-width="1"/>
    <circle cx="247" cy="143" r="4" fill="#FCA5A5"/>
    <circle cx="262" cy="143" r="4" fill="#FDE68A"/>
    <circle cx="277" cy="143" r="4" fill="#A7F3D0"/>
    <text x="310" y="147" fill="#64748B" font-family="monospace" font-size="10">kimmy@profile:~</text>
  </g>

  <g font-family="monospace">
    <text x="252" y="226" fill="#67E8F9" font-size="11">&gt; learning through real projects</text>
    <text x="252" y="246" fill="#A7F3D0" font-size="11">&gt; building useful interfaces</text>
    <text x="252" y="266" fill="#F9A8D4" font-size="11">&gt; waiting for the next idea_</text>
    <text x="252" y="304" fill="#475569" font-size="10">const focus = [</text>
    <text x="268" y="321" fill="#94A3B8" font-size="10">"React", "Next.js", "TypeScript"</text>
    <text x="252" y="338" fill="#475569" font-size="10">];</text>
  </g>

  <g transform="translate(530 218)" shape-rendering="crispEdges">
    <path d="M180 102C225 120 251 83 232 65C221 55 211 66 215 79C219 94 205 104 188 97" stroke="#CFF7D6" stroke-width="11" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 198 81;9 198 81;-7 198 81;0 198 81" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M48 85C48 62 63 47 85 47L99 58L113 47C137 47 156 61 171 76C184 89 196 90 217 88L222 107C200 126 173 131 140 130L82 130C59 127 48 111 48 85Z" fill="url(#scanlines)" stroke="#D9F9DF" stroke-width="2"/>
    <path d="M50 84L40 54L66 66L82 52L97 68L91 104L62 110Z" fill="url(#scanlines)" stroke="#D9F9DF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M59 76L69 72" stroke="#183B38" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;1;.15;1;1" keyTimes="0;.43;.48;.53;1" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M46 111L39 125M88 123L84 137M151 123L157 137" stroke="#CFF7D6" stroke-width="6" stroke-linecap="round"/>
    <path d="M39 94L13 89M40 105L10 112M99 94L121 90" stroke="#CFF7D6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="219" cy="23" r="4" fill="#FDE68A" filter="url(#soft)">
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="monospace" text-anchor="middle">
    <text x="650" y="358" fill="#E2E8F0" font-size="13" letter-spacing="1">meow ♡</text>
    <text x="650" y="379" fill="#64748B" font-size="10">a small screen for a growing journey</text>
  </g>

  <path d="M392 404H588L626 430H354L392 404Z" fill="#101A26" stroke="#334155" stroke-width="2"/>
  <rect x="349" y="430" width="282" height="15" rx="7.5" fill="#0B1220" stroke="#334155"/>
  <path d="M365 437H615" stroke="url(#wave)" stroke-width="2" filter="url(#soft)"/>

  <g font-family="monospace">
    <text x="64" y="454" fill="#475569" font-size="11">mode: learning</text>
    <text x="916" y="454" fill="#475569" font-size="11" text-anchor="end">frontend · portfolio · cats</text>
  </g>
</svg>