<svg width="1200" height="840" viewBox="0 0 1200 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated neon GitHub dashboard with a scanline cat</title>
  <desc id="desc">A dark GitHub-style portfolio dashboard with cyan waves, a horizontally resting scanline cat, statistics cards, charts, technology icons, and social links.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1200" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020304"/>
      <stop offset="0.55" stop-color="#05080D"/>
      <stop offset="1" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="cyanWave" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#103B7A"/>
      <stop offset="0.55" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <pattern id="catScanlines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="5" fill="#E2F6D8" fill-opacity="0.92"/>
      <rect y="5" width="10" height="5" fill="#8AD6A7" fill-opacity="0.72"/>
    </pattern>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="840" rx="18" fill="url(#pageBg)"/>

